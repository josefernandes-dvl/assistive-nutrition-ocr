# Blueprint do Render para deploy automático do backend NutriScan.
# Como usar:
#   1. Push deste arquivo para o GitHub.
#   2. No Render: New → Blueprint → conecte o repositório.
#   3. Render lê este arquivo e provisiona o serviço.
#
# Free tier: 0,1 CPU / 512MB RAM / sleep após 15min sem requests.
# Cold start (~30s) volta ao normal depois.

services:
  - type: web
    name: nutriscan-backend
    runtime: node
    plan: free
    region: oregon            # ou frankfurt / singapore — escolha a mais próxima
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: node src/server.js
    healthCheckPath: /api/health
    autoDeploy: true          # redeploy automático em push para main
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
