name: mobile
description: "Assistive Nutrition OCR - App assistivo para gestão de distúrbios digestivos"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.6 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  http: ^1.2.0
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  path: ^1.9.0
  provider: ^6.1.2
  intl: ^0.19.0
  google_fonts: ^6.2.1
  mobile_scanner: ^5.2.3
  image: ^4.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/